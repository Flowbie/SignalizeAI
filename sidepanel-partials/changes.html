<!-- Account Changes Feed -->
<div id="changes-view" class="website-content-card hidden">
  <div class="content-header">
    <h3 class="content-title">What changed</h3>
    <div class="header-actions-right">
      <button
        id="changes-check-now"
        class="secondary-btn"
        title="Check watched accounts now"
        aria-label="Check watched accounts now"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <polyline points="21 3 21 9 15 9"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <p id="changes-meta" class="changes-meta"></p>

  <div id="changes-loading" class="content-loading hidden">
    <p>Loading changes…</p>
  </div>

  <div id="changes-empty" class="content-empty hidden">
    <div class="empty-state-container">
      <div class="empty-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="opacity: 0.4"
        >
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <polyline points="3 4 3 9 8 9"></polyline>
          <path d="M12 8v4l3 2"></path>
        </svg>
      </div>
      <p class="empty-title">Nothing has changed yet</p>
      <p class="empty-subtitle">
        Saved prospects are re-checked in the background. When a watched account changes its
        pricing, hiring, or homepage messaging, it shows up here.
      </p>
      <button id="changes-go-saved" class="reset-button-ui">Manage watched accounts</button>
    </div>
  </div>

  <div id="changes-list" class="changes-list"></div>
</div>
